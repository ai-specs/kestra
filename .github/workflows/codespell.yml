# ---------------------------------------------------------------------------
# NOTE (dsh): 本工作流为上游 kestra-io 继承、与 dsh 镜像构建/发布任务无关，
# 已在 GitHub Actions 页面停用 (Disabled)，运行列表中看不到它是正常的。
# 当本仓库代码相对上游发生大的变化时，应重新启用本工作流并跑通完整流程。
# 启用前先确认其 job 不依赖本 fork 未配置的 secrets（否则运行期会失败）。
# ---------------------------------------------------------------------------
# Codespell configuration is within .codespellrc
---
name: Codespell

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Annotate locations with typos
        uses: codespell-project/codespell-problem-matcher@b80729f885d32f78a716c2f107b4db1025001c42 # v1.1.0
      - name: Codespell
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2