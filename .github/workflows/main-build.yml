# ---------------------------------------------------------------------------
# NOTE (dsh): 上游 kestra-io 继承的 Main Workflow 的裁剪版（test-only）。
# 依赖本 fork 未配置外部凭据的发布/联动环节（publish-develop-docker /
# publish-develop-maven / generate-configuration-schema / trigger-ee / end）
# 已整体移除，仅保留三个纯测试 job 与 otel 收尾。
# 三个测试 job 实测全绿（2026-08-31），整体成功。
# 保持启用（2026-08-31，用户授权）：develop push / workflow_dispatch 自动跑测试。
# 镜像发布请走 dsh-release-ghcr.yml。
# ---------------------------------------------------------------------------
name: Main Workflow

on:
  push:
    branches:
      - releases/*
      - develop

  workflow_dispatch:
    inputs:
      skip-test:
        description: 'Skip test'
        type: choice
        required: true
        default: 'false'
        options:
          - "true"
          - "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-main
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
    uses: kestra-io/actions/.github/workflows/kestra-oss-backend-tests.yml@main
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
      OTLP_HEADERS: ${{ secrets.OTLP_HEADERS }}
    with:
      java-version: 25

  frontend-tests:
    name: Frontend tests
    if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
    uses: kestra-io/actions/.github/workflows/kestra-oss-frontend-tests.yml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
      OTLP_HEADERS: ${{ secrets.OTLP_HEADERS }}

  design-system-frontend-tests:
    name: Design System Frontend tests
    if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
    uses: kestra-io/actions/.github/workflows/kestra-oss-designsystem-tests.yml@main
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
      OTLP_HEADERS: ${{ secrets.OTLP_HEADERS }}

  otel-export-trace:
    name: OpenTelemetry - Export Trace
    runs-on: ubuntu-latest
    if: always()
    needs: [ backend-tests, frontend-tests, design-system-frontend-tests ]
    env:
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
    steps:
      - name: OpenTelemetry - Export trace
        uses: kestra-io/actions/actions/otel-collect@main
        if: ${{ env.OTLP_ENDPOINT != '' }}
        with:
          mode: export-all
          github-token: ${{ secrets.GITHUB_TOKEN }}
          otlp-endpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlp-headers: "${{ secrets.OTLP_HEADERS }}"
          logs-enabled: 'true'
          service-name: "Github Actions - ${{ github.repository }} - ${{ github.workflow }}"
