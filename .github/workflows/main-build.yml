# ---------------------------------------------------------------------------
# NOTE (dsh): 上游 kestra-io 继承的 Main Workflow 的裁剪版。
# 依赖本 fork 未配置外部凭据的发布/联动环节（publish-develop-maven /
# generate-configuration-schema / trigger-ee / end）已整体移除；保留三个纯测试
# job + publish-ghcr（参考上游 publish-develop-docker 模式：三个测试 job 全通过
# 后发布镜像到 ghcr.io/ai-specs/kestra：develop push 发 dev-<sha>，tag v* 发对应
# 版本并更新 latest）。原独立工作流 dsh-release-ghcr.yml 已删除（2026-09-01，
# 用户授权），tag 与 develop 均走本流程、无独立发布任务。
# 三个测试 job 实测全绿（2026-08-31），整体成功。
# 保持启用（2026-08-31 用户授权）：develop push / tag v* / workflow_dispatch。
# otel-export-trace 依赖本 fork 未配置的 OTLP secrets 会失败，已移除。
# ---------------------------------------------------------------------------
name: Main Workflow

on:
  push:
    branches:
      - releases/*
      - develop
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      skip-test:
        description: 'Skip test'
        type: choice
        required: true
        default: 'false'
        options:
          - "true"
          - "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-main
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
    uses: kestra-io/actions/.github/workflows/kestra-oss-backend-tests.yml@main
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
      OTLP_HEADERS: ${{ secrets.OTLP_HEADERS }}
    with:
      java-version: 25

  frontend-tests:
    name: Frontend tests
    if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
    uses: kestra-io/actions/.github/workflows/kestra-oss-frontend-tests.yml@main
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
      OTLP_HEADERS: ${{ secrets.OTLP_HEADERS }}

  design-system-frontend-tests:
    name: Design System Frontend tests
    if: ${{ github.event.inputs.skip-test == 'false' || github.event.inputs.skip-test == '' }}
    uses: kestra-io/actions/.github/workflows/kestra-oss-designsystem-tests.yml@main
    secrets:
      GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OTLP_ENDPOINT: ${{ secrets.OTLP_ENDPOINT }}
      OTLP_HEADERS: ${{ secrets.OTLP_HEADERS }}

  publish-ghcr:
    name: Publish image to GHCR
    needs: [backend-tests, frontend-tests, design-system-frontend-tests]
    if: "!failure() && !cancelled() && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/'))"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute image names and version
        id: vars
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REGISTRY_LC="ghcr.io"
          EXTRA_TAGS=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            EXTRA_TAGS="${REGISTRY_LC}/${OWNER_LC}/kestra:latest"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          {
            echo "version=${VERSION}"
            echo "owner=${OWNER_LC}"
            echo "base_image=${REGISTRY_LC}/${OWNER_LC}/kestra-base:latest"
            echo "image=${REGISTRY_LC}/${OWNER_LC}/kestra"
            echo "extra_tags=${EXTRA_TAGS}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Gradle executableJar
        run: ./gradlew executableJar --no-daemon --console=plain

      - name: Stage executable into image context (official build-docker-from-exec flow)
        run: |
          cp build/executable/* docker/app/kestra
          chmod +x docker/app/kestra
          ls -lh docker/app/kestra

      - name: Setup QEMU (arm64 cross build)
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Record base image digest (audit)
        id: base-digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "${{ steps.vars.outputs.base_image }}" --format '{{json .Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "本次发布使用的 kestra-base digest: ${DIGEST}"

      - name: Build & push kestra image (Dockerfile, BASE_IMAGE = kestra-base:latest)
        run: |
          TAGS="-t ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}"
          if [ -n "${{ steps.vars.outputs.extra_tags }}" ]; then
            TAGS="${TAGS} -t ${{ steps.vars.outputs.extra_tags }}"
          fi
          docker buildx build \
            --platform "linux/amd64,linux/arm64" \
            -f Dockerfile \
            --build-arg "BASE_IMAGE=${{ steps.vars.outputs.base_image }}" \
            ${TAGS} \
            --push \
            .

      - name: Job summary
        run: |
          {
            echo "## dsh Kestra 镜像已发布到 GHCR"
            echo ""
            echo "版本: \`${{ steps.vars.outputs.version }}\`"
            echo "镜像: \`${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}\`"
            echo "基础镜像: \`${{ steps.vars.outputs.base_image }}\`（由 dsh-push-base-image.yml 维护）"
            echo "基础镜像 digest（审计）: ${{ steps.base-digest.outputs.digest }}"
            echo "平台: \`linux/amd64,linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
