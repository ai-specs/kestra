# ---------------------------------------------------------------------------
# NOTE (dsh): 本工作流为上游 kestra-io 继承、与 dsh 镜像构建/发布任务无关，
# 已在 GitHub Actions 页面停用 (Disabled)，运行列表中看不到它是正常的。
# 当本仓库代码相对上游发生大的变化时，应重新启用本工作流并跑通完整流程。
# 启用前先确认其 job 不依赖本 fork 未配置的 secrets（否则运行期会失败）。
# ---------------------------------------------------------------------------
name: Vulnerabilities Checks

on:
  schedule:
    - cron: "0 0 * * *"  # Every day
  workflow_dispatch: {}

env:
  JAVA_VERSION: '25'

permissions:
  contents: read

jobs:
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Setup build
      - uses: kestra-io/actions/composite/setup-build@main
        id: build
        with:
          java-enabled: true
          node-enabled: true
          java-version: 25

      # Npm
      - name: Npm - Install
        shell: bash
        working-directory: ui
        run: npm ci

      # Run OWASP dependency check plugin
      - name: Gradle Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NIST_APIKEY }}
        run: |
          ./gradlew dependencyCheckAggregate

        # Upload dependency check report
      - name: Upload dependency check report
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html

  develop-image-check:
    name: Image Check (develop)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # Checkout
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Setup build
      - uses: kestra-io/actions/composite/setup-build@main
        id: build
        with:
          java-enabled: false
          node-enabled: false
          java-version: 25

      # Run Trivy image scan for Docker vulnerabilities, see https://github.com/aquasecurity/trivy-action
      - name: Docker Vulnerabilities Check
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: kestra/kestra:develop
          format: 'template'
          template: '@/contrib/sarif.tpl'
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.sarif'
          skip-dirs: /app/plugins

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: docker-

  latest-image-check:
    name: Image Check (latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # Checkout
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Setup build
      - uses: kestra-io/actions/composite/setup-build@main
        id: build
        with:
          java-enabled: false
          node-enabled: false
          java-version: 25

      # Run Trivy image scan for Docker vulnerabilities, see https://github.com/aquasecurity/trivy-action
      - name: Docker Vulnerabilities Check
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: kestra/kestra:latest
          format: table
          skip-dirs: /app/plugins
          scanners: vuln
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: docker-