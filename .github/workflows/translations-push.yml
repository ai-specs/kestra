name: Translations - Push

# The PR gate (`translations` job in pull-request.yml) only sees pull requests. A merge race between
# two green PRs, a direct push or a cherry-pick that lands with a stale locale can still leave a
# branch red, and nobody notices until the next unrelated PR against it fails the gate for its
# author. This runs the same dependency-free check on every push to develop and the release
# branches, so the branch itself reports the breakage.
on:
  push:
    branches:
      - develop
      - 'releases/*'
    paths:
      # The used-key rule scans all of ui/src, so any UI change can introduce a key defined nowhere.
      - 'ui/**'
      - '.github/workflows/translations-push.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  translations:
    name: 'Translations - Key parity, placeholders and drift'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_BOT_APP_ID: ${{ secrets.GH_BOT_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'ui/.nvmrc'

      # EE renders OSS keys too, so the unused-key rule needs the EE tree: the same-name EE branch exists
      # for every branch this workflow runs on (develop, releases/*).
      - name: Generate GitHub App token for kestra-ee
        id: ee-token
        if: env.GH_BOT_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          owner: kestra-io
          repositories: kestra-ee

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout - EE sources
        if: steps.ee-token.outputs.token != ''
        with:
          repository: kestra-io/kestra-ee
          ref: ${{ github.ref_name }}
          token: ${{ steps.ee-token.outputs.token }}
          path: kestra-ee
          sparse-checkout: |
            ui-ee/src/
          sparse-checkout-cone-mode: false

      - name: Check translations
        run: |
          if [ -d kestra-ee/ui-ee/src ]; then
            node ui/scripts/translations/check-translations.mjs --scope oss --ee-root kestra-ee
          else
            node ui/scripts/translations/check-translations.mjs --scope oss
          fi

  # dsh fork 裁剪（2026-09-13）：上游原版在检查通过后用 GitHub App 凭据
  # （GH_BOT_APP_ID/GH_BOT_PRIVATE_KEY）向私有仓库 kestra-io/kestra-ee 发
  # repository_dispatch 通知 EE 同步 en.json——fork 无此凭据且不与上游 EE 协同
  # （对抗性上游零协同原则），删除 notify-ee job；翻译门禁检查保留。
  # 上游原文件中该 job 为：
  #   notify-ee: needs translations, uses kestra-io/actions/composite/repository-dispatch@main,
  #   repository: kestra-io/kestra-ee, event-type: oss-translations-updated
