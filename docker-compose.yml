volumes:
  postgres-data:
    driver: local
  kestra-data:
    driver: local

services:
  postgres:
    image: postgres:18
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10

  kestra:
    # dsh-monorepo：本地纯源码构建（不使用 kestra/kestra 官方镜像）。
    # 链路：Dockerfile.base -> kestra-base:2.0.0-jre25 -> (executableJar 暂存 docker/app/kestra) -> Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: kestra-base:2.0.0-jre25
    image: dsh-kestra:2.0.0-snapshot
    pull_policy: never
    # Kestra, by default, has a termination grace period of 5m. We need to wait a little more to be sure no active tasks are running.
    stop_grace_period: 6m
    # Note that this setup with a root user is intended for development purpose.
    # Our base image runs without root, but the Docker Compose implementation needs root to access the Docker socket
    user: "root"
    command: server standalone
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        dsh:
          metrics:
            jdbc-url: jdbc:postgresql://postgres:5432/kestra
            jdbc-username: kestra
            jdbc-password: k3str4
          gateway:
            token: dsh-gateway-token
            enterprise-token: dsh-enterprise-token
            systems:
              enterprise:
                base-url: http://mock-enterprise:9000
        kestra:
          server:
            basic-auth:
              username: admin@kestra.io # it must be a valid email address
              password: Admin1234! # it must be at least 8 characters long with uppercase letter and a number
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      # 宿主 8080 已被 meta-agent-monorepo 的 kestra 占用，dsh 栈改用 18080
      - "18080:8080"
      - "18081:8081"   # management: /prometheus 含 dsh_ 指标
      # The following is the management port, not exposed by default.
      # Note that exposing the management port is intended for development purpose as this port is un-authenticated by default
      # and expose sensitive information and actions.
      # - "8081:8081"
    depends_on:
      postgres:
        condition: service_started

# 企业侧组件共享网络（Kestra、PostgreSQL、Nacos、mock 企业系统平级互通）
networks:
  default:
    name: dsh-net
