# ⚠️ AI AGENT 提示词（必读）⚠️
# 本文件（app-kestra/docker-compose.yml）是「最小参考 compose」，仅用于阅读与理解
# 单服务形态（Kestra + PostgreSQL），**禁止作为启动入口**：
#   ❌ 禁止在 app-kestra 目录下执行 `docker compose up` / `docker compose up -d` /
#      `docker compose down` / `--force-recreate` 等任何会创建/销毁容器的操作。
#   ❌ 禁止用本文件启动的容器（app-kestra-kestra-1 / app-kestra-postgres-1）替代
#      根目录服务的容器（dsh-kestra / dsh-postgres）。
# 唯一启动入口 = 仓库根目录的 /Users/xuybin/dsh-monorepo/docker-compose.yml（全栈，
# 含 Nacos / dsh-ui / dsh(PC) / mock-enterprise；kestra 服务 container_name=dsh-kestra，
# image=dsh-kestra:2.0.0-snapshot，构建 context=./app-kestra 已内置插件烘焙）：
#   cd /Users/xuybin/dsh-monorepo
#   docker compose build kestra   # 代码变更后重建镜像（COPY docker/app/kestra + locals/plugins）
#   docker compose up -d          # 启动/重建全栈
# 排查端口占用/容器状态也用根目录 compose：docker compose ps / logs / inspect。
# 在 app-kestra 下单独启动会：占用同一组端口（18080/18081）、创建同名 postgres-data
# volume 与不同容器名的 postgres，与根 compose 互相打架，且不含 Nacos 等企业侧服务。
# （2026-09-10 实测教训：在 app-kestra 下误启动导致端口冲突、容器名混乱，已纠正。）

# 与根目录 docker-compose.yml 保持同一组默认值（kestra/kestra/k3str4、18080/18081），
# 全部经 ${VAR:-default} 参数化：不设环境变量时行为与硬编码一致；设了即可覆盖。
# 本文件不自动加载根目录 .env（compose 只读「本文件同目录」的 .env），如需共享
# 根 .env 的覆盖值，两种方式任选：
#   · 仓库根目录执行  bun run up:standalone / down:standalone（已用 --env-file .env 指向根 .env）
#   · app-kestra 目录执行  docker compose --env-file ../.env up -d
# 或先 export 对应变量（CI/脚本场景）。
#
# 完整企业侧栈（含 Nacos/dsh-ui/dsh(PC)/mock-enterprise）请用根目录 docker-compose.yml。
# ⚠️ 再次强调：本文件不是启动入口，禁止单独 `docker compose up`。⚠️

volumes:
  postgres-data:
    driver: local
  kestra-data:
    driver: local

services:
  postgres:
    image: postgres:18
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kestra}
      POSTGRES_USER: ${POSTGRES_USER:-kestra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-k3str4}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10

  kestra:
    # dsh-monorepo：本地纯源码构建（不使用 kestra/kestra 官方镜像）。
    # 链路：Dockerfile.base -> kestra-base:2.0.0-jre25 -> (executableJar 暂存 docker/app/kestra) -> Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: kestra-base:2.0.0-jre25
    image: dsh-kestra:2.0.0-snapshot
    pull_policy: never
    # Kestra, by default, has a termination grace period of 5m. We need to wait a little more to be sure no active tasks are running.
    stop_grace_period: 6m
    # Note that this setup with a root user is intended for development purpose.
    # Our base image runs without root, but the Docker Compose implementation needs root to access the Docker socket
    user: "root"
    command: server standalone
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kestra}
            driverClassName: org.postgresql.Driver
            username: ${POSTGRES_USER:-kestra}
            password: ${POSTGRES_PASSWORD:-k3str4}
        dsh:
          metrics:
            jdbc-url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kestra}
            jdbc-username: ${POSTGRES_USER:-kestra}
            jdbc-password: ${POSTGRES_PASSWORD:-k3str4}
          gateway:
            token: ${DSH_GATEWAY_TOKEN:-dsh-gateway-token}
            enterprise-token: ${ENTERPRISE_TOKEN:-dsh-enterprise-token}
            systems:
              enterprise:
                base-url: http://mock-enterprise:9000
        kestra:
          server:
            basic-auth:
              username: ${KESTRA_OIDC_ADMIN_USER:-admin@kestra.io} # it must be a valid email address
              password: ${KESTRA_OIDC_ADMIN_PASSWORD:-Admin1234!} # it must be at least 8 characters long with uppercase letter and a number
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: ${KESTRA_URL:-http://localhost:8080/}
    ports:
      - "${KESTRA_PORT:-18080}:8080"
      - "${KESTRA_MANAGEMENT_PORT:-18081}:8081"   # management: /prometheus 含 dsh_ 指标
      # The following is the management port, not exposed by default.
      # Note that exposing the management port is intended for development purpose as this port is un-authenticated by default
      # and expose sensitive information and actions.
      # - "8081:8081"
    depends_on:
      postgres:
        condition: service_started

# 企业侧组件共享网络（Kestra、PostgreSQL、Nacos、mock 企业系统平级互通）
networks:
  default:
    name: dsh-net
